# ── Render - Paflegis (Full-Stack Node) ────────────────────────────────────────
# Deploy como Web Service Node.js no Render.com
# Documentação: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: paflegis
    runtime: node
    region: oregon           # Troque por: ohio, singapore, frankfurt, etc.
    plan: free               # Troque por: starter, standard, pro em produção
    branch: main

    buildCommand: npm ci && npm run build
    startCommand: npm run start

    healthCheckPath: /api/v1/estatisticas

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render injeta $PORT automaticamente; este é o default
      - key: GEMINI_API_KEY
        sync: false           # Definido manualmente no painel do Render
      - key: SESSION_SECRET
        generateValue: true   # Render gera automaticamente um valor seguro

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
