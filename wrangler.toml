# Cloudflare Pages — Paflegis
#
# Deploy command (painel CF Pages ou CI):
#   npx wrangler pages deploy dist
#
# A pasta functions/ na raiz do projeto é detectada automaticamente
# pelo Wrangler como Pages Functions (functions/api/[[path]].ts).
#
# Variáveis de ambiente: configure no painel Cloudflare
#   Workers & Pages → paflegis → Settings → Environment Variables:
#     GEMINI_API_KEY   = <sua chave>
#     SESSION_SECRET   = <segredo aleatório>

name = "paflegis"
pages_build_output_dir = "./dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
