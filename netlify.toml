# ── Netlify - Paflegis ─────────────────────────────────────────────────────────
# Deploy como site estático (frontend) com Functions serverless ou como
# aplicação full-stack via Netlify SSR (Node adapter).
#
# Para deploy ESTÁTICO (recomendado no Netlify):
#   1. Configure as env vars no painel: GEMINI_API_KEY, SESSION_SECRET, NODE_ENV
#   2. Aponte o build command abaixo
#   3. O backend não roda no Netlify estático - use Render ou Railway para o server
#
# Para deploy FULL-STACK (Netlify SSR / Edge):
#   Adapte o entry point para netlify/functions/server.mjs

[build]
  command       = "npm run build"
  publish       = "dist"
  ignore        = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!public'"

[build.environment]
  NODE_VERSION  = "20"
  NODE_ENV      = "production"

# ── Redirects - SPA fallback ───────────────────────────────────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "https://paflegis-api.onrender.com/api/:splat"
  status = 200
  force  = false

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers de segurança ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "SAMEORIGIN"
    X-Content-Type-Options       = "nosniff"
    X-XSS-Protection             = "1; mode=block"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security    = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
