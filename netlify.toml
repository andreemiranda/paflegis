[build]
  command   = "npm install --include=dev && npm run build:static"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  NODE_ENV     = "production"
  NPM_FLAGS    = "--include=dev"

# Functions config - aumenta timeout para o endpoint de sessoes (busca todas as paginas do SAPL)
[functions]
  node_bundler = "esbuild"

[functions."api"]
  included_files = []

# ── Redirects ──────────────────────────────────────────────────────────────────
# /api/* e /chat  →  Netlify Function (proxy SAPL + Gemini)
[[redirects]]
  from  = "/api/*"
  to    = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers de seguranca ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    X-XSS-Protection          = "1; mode=block"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
